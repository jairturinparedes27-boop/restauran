[pytest]
testpaths = tests
# En Windows, QPrinter consulta las impresoras por COM y Windows lanza y maneja
# internamente la excepción 0x80040155. El faulthandler de pytest la informa
# como "Windows fatal exception" aunque no es un fallo; se desactiva para no ensuciar la salida.
addopts = -p no:faulthandler
